# Local development infrastructure. `make up` (or `docker compose -f infra/docker-compose.yml up -d`), then `make migrate`.
name: pishkhan

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: pishkhan
      POSTGRES_USER: pishkhan
      POSTGRES_PASSWORD: pishkhan
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports: ["5432:5432"]
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pishkhan -d pishkhan"]
      interval: 5s
      retries: 20

  # Two Redis instances (backend plan 4): cache (evictable) and state (rate limits, locks, OTP, sessions; noeviction).
  redis-cache:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lfu", "--save", ""]
    ports: ["6381:6379"]

  redis-state:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes: ["redis-state:/data"]


  # Production uses a private signature mirror because the official CDN blocks Iran (backend plan 8.2).
  clamav:
    image: clamav/clamav:1.4
    ports: ["3310:3310"]
    volumes: ["clamav:/var/lib/clamav"]

volumes:
  postgres:
  redis-state:
  clamav:
