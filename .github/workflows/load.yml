name: load

# Launch load test (BE-2.11): k6 against a staging environment, never against a CI runner's own stack or production.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "webhook-burst or panel-api"
        required: true
        default: webhook-burst
        type: choice
        options: [webhook-burst, panel-api]
      base_url:
        description: "Target host (Ingress for webhook-burst, Api for panel-api)"
        required: true
      rate:
        description: "webhook-burst: events per second (default 4000, 2× the capacity plan)"
        required: false
        default: "4000"
      vus:
        description: "panel-api: agents at peak (default 400)"
        required: false
        default: "400"
      duration:
        description: "Steady-state duration"
        required: false
        default: "5m"

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Run
        env:
          BASE_URL: ${{ inputs.base_url }}
          RATE: ${{ inputs.rate }}
          VUS: ${{ inputs.vus }}
          DURATION: ${{ inputs.duration }}
          APP_SECRET: ${{ secrets.LOAD_APP_SECRET }}
          ACCOUNTS: ${{ secrets.LOAD_ACCOUNTS }}
          TOKENS: ${{ secrets.LOAD_TOKENS }}
        run: k6 run --summary-export=summary.json "tests/load/${{ inputs.scenario }}.js"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-${{ inputs.scenario }}
          path: backend/summary.json
